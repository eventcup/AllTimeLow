<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>EventCup 3D Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== Import Maps (WICHTIG für three-Imports) ===== -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <!-- Optional externe CSS-Datei -->
  <link rel="stylesheet" href="style.css" />

  <!-- Basis-Styles, falls style.css leer ist -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #202020;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #viewer-container {
      width: 100vw;
      height: 100vh;
    }

    .eventcup-logo {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 90px;
      opacity: 0.9;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- ===== Three.js Container ===== -->
  <div id="viewer-container"></div>

  <!-- ===== EventCup Logo (jetzt in assets/) ===== -->
  <img src="asset/logo.png" alt="EventCup Logo" class="eventcup-logo" />

  <!-- ===== Main Script ===== -->
  <script type="module" src="main.js"></script>

</body>
</html>
